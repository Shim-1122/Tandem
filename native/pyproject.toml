[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tandem_core"
version = "0.1.0"
description = "Tandem's per-frame math in Rust (optional: vtrack runs the same math in Python without it)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
