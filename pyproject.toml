[project]
name = "vision-joint-tracker"
version = "0.1.0"
description = "Camera-based arm, hand, finger, head and face tracking for robot control"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10", "opencv-python>=4.8", "certifi"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
