[project]
name = "vision-joint-tracker"
version = "0.1.0"
description = "Camera-based hand gesture recognition and arm/hand joint angle tracking for robot control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
